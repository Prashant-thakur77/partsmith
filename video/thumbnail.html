<!doctype html>
<html><head><meta charset="utf-8"><title>PartSmith thumbnail</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#faf7f1;font-family:Geist,sans-serif;color:#1c2230}
  .bg{position:absolute;inset:0;background:radial-gradient(70vw 70vh at 100% 100%,rgba(232,89,12,.14),transparent 60%),linear-gradient(rgba(90,75,50,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(90,75,50,.07) 1px,transparent 1px);background-size:auto,3vw 3vw,3vw 3vw}
  .copy{position:absolute;left:5vw;top:11vh;width:47vw}
  .kick{font-weight:800;font-size:1.9vw;letter-spacing:.1em;color:#e8590c}
  h1{font-weight:900;font-size:6.9vw;line-height:1;margin:3vh 0 0;letter-spacing:-.03em}
  h1 em{font-style:normal;color:#e8590c}
  .line{margin-top:4vh;font-size:2.9vw;font-weight:800;line-height:1.15}
  .chips{margin-top:4vh;display:flex;gap:1vw;flex-wrap:wrap}
  .chips span{font-size:1.6vw;font-weight:800;padding:.6vw 1.1vw;border-radius:99px;border:.15vw solid #ddd6c8;background:#fdfcf9}
  .shot{position:absolute;border-radius:1.2vw;overflow:hidden;border:.3vw solid #ddd6c8;box-shadow:0 1.5vw 4vw rgba(90,75,50,.3)}
  .shot img{display:block;width:100%}
  .a{right:2.5vw;top:9vh;width:42vw;transform:rotate(1.2deg)}
  .b{right:7vw;top:50vh;width:38vw;transform:rotate(-1.6deg);border-color:#e8590c}
  .frame{position:absolute;border-radius:1.6vw;border:.25vw solid #ddd6c8;inset:1.5vw}
</style></head><body>
<div class="bg"></div>
<div class="shot a"><img src="STILLS/thumb-a.jpg"></div>
<div class="shot b"><img src="STILLS/thumb-b.jpg"></div>
<div class="copy">
  <div class="kick">PARTSMITH · BUILT WITH META'S MODELS</div>
  <h1>Broken part?<br><em>Your laptop</em><br>is the ruler.</h1>
  <div class="line">Photo in. Part checked to half a millimetre out.</div>
  <div class="chips"><span>SAM 3.1</span><span>Muse Spark</span><span>Open weights</span></div>
</div>
<div class="frame"></div>
</body></html>
