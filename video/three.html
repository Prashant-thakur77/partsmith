<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Under the hood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@500;600;700&family=Geist+Mono:wght@500;600&display=swap">
<style>
  :root {
    --text: #1c2230; --muted: #5b6170; --accent: #f86111; --pass: #007439;
    --danger: #be2323; --dim: #006f8c; --panel: #fdfcf9; --edge: #cfc8ba;
  }
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; overflow: hidden; background: #faf7f1; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #gl { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  #svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none; }
  #ov { position: absolute; inset: 0; pointer-events: none; }
  .abs { position: absolute; left: 0; top: 0; white-space: nowrap; opacity: 0; }

  .lab { color: var(--text); }
  .lab .row { display: flex; align-items: baseline; }
  .lab .n { width: 46px; flex: none; font: 600 32px/50px "Geist Mono", monospace; color: var(--muted); }
  .lab .t { font: 600 42px/50px "Geist", sans-serif; letter-spacing: -.012em; }
  .lab .s { margin-left: 46px; font: 500 27px/34px "Geist Mono", monospace; color: var(--muted); }

  .sat { font: 500 26px/32px "Geist Mono", monospace; color: var(--text); }
  .sathead { font: 500 24px/30px "Geist Mono", monospace; color: var(--muted); }

  .pill {
    font: 600 24px/1 "Geist Mono", monospace; padding: 10px 16px; border-radius: 999px;
    background: var(--panel); border: 2px solid var(--edge); color: var(--text);
  }
  .pill.pass { color: #fff; background: var(--pass); border-color: var(--pass); }
  .pill.acc { color: var(--accent); border-color: var(--accent); }
  .pill.bad { color: var(--danger); border-color: var(--danger); }
  .pill svg { display: inline-block; vertical-align: -3px; margin-right: 10px; }

  #ctr { width: 170px; height: 150px; }
  #ctr .hd, #ctr .v { position: absolute; left: 0; font-family: "Geist Mono", monospace; }
  #ctr .hd { font-size: 24px; font-weight: 500; line-height: 30px; color: var(--muted); }
  #ctr .v { font-size: 32px; font-weight: 600; line-height: 38px; color: var(--text); }

  #call {
    width: 440px; white-space: normal; box-sizing: border-box; padding: 12px 18px 14px;
    background: var(--panel); border: 2px solid var(--edge); border-left: 8px solid var(--danger); border-radius: 10px;
    font: 600 36px/44px "Geist", sans-serif; letter-spacing: -.01em; color: var(--text);
  }
  #call b { color: var(--danger); font-weight: 700; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="1920" height="1080"></canvas>
  <svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="ov"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
  'use strict';
  window.__ready = false;

  // ------------------------------------------------------------ parameters
  var W = 1920, H = 1080, BASE_DUR = 22;
  var BASE = { photo: 0.3, sam: 2.1, measure: 3.9, agent: 5.7, sandbox: 7.5, verifier: 9.0, blocked: 12.6, human: 15.2, registry: 16.8, satellites: 18.3, final: 20.4 };

  function param(name) {
    var q = new URLSearchParams(location.search).get(name);
    if (q !== null) return q;
    return new URLSearchParams(location.hash.replace(/^#/, '')).get(name);
  }
  var given = {};
  try { given = JSON.parse(param('cues') || '{}') || {}; } catch (e) { given = {}; }
  var DUR = parseFloat(param('dur'));
  var hasDur = isFinite(DUR) && DUR > 0;
  if (!hasDur) DUR = Math.max(BASE_DUR, (parseFloat(given.final) || 0) + 1.6);
  var C = {};
  Object.keys(BASE).forEach(function (k) {
    var v = parseFloat(given[k]);
    C[k] = isFinite(v) ? v : BASE[k] * DUR / BASE_DUR;
  });
  var ERR = (param('err') || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean).slice(-3);

  // ------------------------------------------------------------ helpers
  function clamp01(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function bezier(x1, y1, x2, y2) {
    function bx(s) { return 3 * (1 - s) * (1 - s) * s * x1 + 3 * (1 - s) * s * s * x2 + s * s * s; }
    function by(s) { return 3 * (1 - s) * (1 - s) * s * y1 + 3 * (1 - s) * s * s * y2 + s * s * s; }
    return function (x) {
      if (x <= 0) return 0; if (x >= 1) return 1;
      var lo = 0, hi = 1;
      for (var i = 0; i < 40; i++) { var s = (lo + hi) / 2; if (bx(s) < x) lo = s; else hi = s; }
      return by((lo + hi) / 2);
    };
  }
  var ease = bezier(0.16, 1, 0.3, 1);
  function smooth(u) { u = clamp01(u); return u * u * (3 - 2 * u); }
  function span(t, a, len) { return clamp01((t - a) / len); }
  function win(t, a, b, fi, fo) { return (t < a || t > b) ? 0 : Math.min(clamp01((t - a) / fi), clamp01((b - t) / fo)); }

  // ------------------------------------------------------------ palette
  var HEX = { top: 0xfdfcf9, side: 0xe9e3d6, edge: 0xcfc8ba, accent: 0xf86111, danger: 0xbe2323, shade: 0x6a5638 };
  var COL = {};
  Object.keys(HEX).forEach(function (k) { COL[k] = new THREE.Color(HEX[k]); });
  COL.topHot = new THREE.Color(0xfff1e6);
  COL.sideHot = new THREE.Color(0xf6bd96);

  // ------------------------------------------------------------ layout (world units)
  var SW = 400, SD = 210, ST = 14, SP = 116, NL = 7, RP = 7.5;
  var FLOOR_Y = -92;
  function layerY(i) { return i * SP; }
  function topY(i) { return layerY(i) + ST / 2 + RP + 1; }

  var LAYERS = [
    { cue: 'photo',   t: 'Phone photo on the screen mat',      s: 'markers give true scale' },
    { cue: 'sam',     t: 'SAM 3.1 cuts out the part',          s: 'the model looks' },
    { cue: 'measure', t: 'Code measures millimetres',          s: 'no model here' },
    { cue: 'agent',   t: 'Muse Spark Open writes CadQuery',    s: 'a program with named knobs' },
    { cue: 'sandbox', t: 'Sandbox runs it, verifier compares', s: 'only code can pass a part' },
    { cue: 'human',   t: 'A person can send it back',          s: 'pins on the photo' },
    { cue: 'registry',t: 'Open registry and export gate',      s: 'REST and MCP' }
  ];
  function cueOf(i) { return C[LAYERS[i].cue]; }

  // satellite chips, top to bottom; the column order keeps the traces short
  var SAT_X = 474, SAT_S = 54, SAT_H = 18;
  var SATS = [
    { name: 'Muse Image',       y: 610, to: 6, off:  4, rail: 430 },
    { name: 'Muse Wonder',      y: 526, to: 6, off: -4, rail: 424 },
    { name: 'Voice Transcribe', y: 442, to: 3, off:  4, rail: 418 },
    { name: 'SAM 3.1',          y: 358, to: 1, off:  4, rail: 412 },
    { name: 'Muse Spark 1.3',   y: 274, to: 1, off: -4, rail: 406 },
    { name: 'Muse Spark Open',  y:  56, to: 3, off: -4, rail: 400 }
  ];
  var HEADS = [
    { text: 'Meta Model API',         y: 674 },
    { text: 'Open weights \u00b7 Baseten', y: 120 }
  ];

  // ------------------------------------------------------------ three setup
  var canvas = document.getElementById('gl');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H, false);
  var ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(22, W / H, 100, 9000);

  function mkCanvas(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function mkTex(c) { var t = new THREE.CanvasTexture(c); t.anisotropy = ANISO; return t; }

  // background gradient
  (function () {
    var c = mkCanvas(4, 256), x = c.getContext('2d');
    var g = x.createLinearGradient(0, 0, 0, 256);
    g.addColorStop(0, '#faf7f1'); g.addColorStop(1, '#f1ece2');
    x.fillStyle = g; x.fillRect(0, 0, 4, 256);
    scene.background = new THREE.CanvasTexture(c);
  })();

  // floor: blueprint grid
  var floorMat = (function () {
    var S = 2048, c = mkCanvas(S, S), x = c.getContext('2d');
    x.lineCap = 'butt';
    var cells = 50;
    for (var i = 0; i <= cells; i++) {
      var p = i / cells * S, major = i % 5 === 0;
      x.strokeStyle = major ? 'rgba(70,60,40,.18)' : 'rgba(70,60,40,.10)';
      x.lineWidth = major ? 1.8 : 1.1;
      x.beginPath(); x.moveTo(p, 0); x.lineTo(p, S); x.stroke();
      x.beginPath(); x.moveTo(0, p); x.lineTo(S, p); x.stroke();
    }
    x.globalCompositeOperation = 'destination-in';
    var g = x.createRadialGradient(S / 2, S / 2, S * 0.1, S / 2, S / 2, S * 0.5);
    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(0.6, 'rgba(0,0,0,.6)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = g; x.fillRect(0, 0, S, S);
    return new THREE.MeshBasicMaterial({ map: mkTex(c), transparent: true, depthWrite: false });
  })();
  var floor = new THREE.Mesh(new THREE.PlaneGeometry(2400, 2400).rotateX(-Math.PI / 2), floorMat);
  floor.position.y = FLOOR_Y; floor.renderOrder = -3;
  scene.add(floor);

  // blurred rounded rectangle, shared by floor shadows and slab halos
  var softTex = (function () {
    var c = mkCanvas(512, 320), x = c.getContext('2d');
    x.filter = 'blur(26px)'; x.fillStyle = '#fff';
    roundRect(x, 70, 62, 372, 196, 30); x.fill();
    return new THREE.CanvasTexture(c);
  })();
  function softPlane(w, d, color) {
    var m = new THREE.MeshBasicMaterial({ map: softTex, color: color, transparent: true, depthWrite: false });
    return new THREE.Mesh(new THREE.PlaneGeometry(w, d).rotateX(-Math.PI / 2), m);
  }
  var shadow = softPlane(SW * 1.45, SD * 1.7, HEX.shade);
  shadow.position.y = FLOOR_Y + 0.5; shadow.renderOrder = -2; scene.add(shadow);
  var satShadow = softPlane(280, 240, HEX.shade);
  satShadow.position.set(SAT_X + 10, FLOOR_Y + 0.5, 0); satShadow.renderOrder = -2; scene.add(satShadow);
  var floorGlow = softPlane(SW * 2.2, SD * 3.0, HEX.accent);
  floorGlow.position.y = FLOOR_Y + 0.8; floorGlow.renderOrder = -1; scene.add(floorGlow);

  function roundRect(x, l, t, w, h, r) {
    x.beginPath();
    x.moveTo(l + r, t); x.lineTo(l + w - r, t); x.quadraticCurveTo(l + w, t, l + w, t + r);
    x.lineTo(l + w, t + h - r); x.quadraticCurveTo(l + w, t + h, l + w - r, t + h);
    x.lineTo(l + r, t + h); x.quadraticCurveTo(l, t + h, l, t + h - r);
    x.lineTo(l, t + r); x.quadraticCurveTo(l, t, l + r, t); x.closePath();
  }
  function rrShape(w, d, r) {
    var s = new THREE.Shape(), x = -w / 2, y = -d / 2;
    s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
    s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
    s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
    s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
    return s;
  }
  function rrBox(w, d, h, r) {
    var g = new THREE.ExtrudeGeometry(rrShape(w, d, r), { depth: h, bevelEnabled: false, curveSegments: 8 });
    g.rotateX(-Math.PI / 2); g.translate(0, -h / 2, 0);
    return g;
  }
  function rimGeo(w, d, r, e) {
    var s = rrShape(w, d, r);
    var inner = rrShape(w - 2 * e, d - 2 * e, Math.max(1, r - e));
    s.holes.push(new THREE.Path(inner.getPoints(8)));
    return new THREE.ShapeGeometry(s, 8).rotateX(-Math.PI / 2);
  }

  // ------------------------------------------------------------ slab faces
  function partPath(x, cx, cy, s) {
    function P(a, b) { return [cx + a * s, cy + b * s]; }
    var pts = [[-0.72, -0.45], [0.28, -0.45], [0.42, -0.24], [0.24, -0.06], [0.46, 0.12], [0.3, 0.28], [0.38, 0.45], [-0.72, 0.45]];
    x.beginPath();
    var a0 = P(pts[0][0], pts[0][1]); x.moveTo(a0[0], a0[1]);
    for (var i = 1; i < pts.length; i++) { var q = P(pts[i][0], pts[i][1]); x.lineTo(q[0], q[1]); }
    x.arc(cx - 0.72 * s, cy, 0.45 * s, Math.PI / 2, Math.PI * 1.5);
    x.closePath();
    var h1 = P(-0.72, 0); x.moveTo(h1[0] + 0.22 * s, h1[1]); x.arc(h1[0], h1[1], 0.22 * s, 0, Math.PI * 2);
    var h2 = P(-0.12, 0); x.moveTo(h2[0] + 0.13 * s, h2[1]); x.arc(h2[0], h2[1], 0.13 * s, 0, Math.PI * 2);
  }
  var FW = 1024, FH = 512;
  var ORANGE = '#f86111', SOFT = '#5b6170', LINE = '#b4ac9c', MAT = '#f3efe6';
  var FACE = [
    function (x) { // screen mat with a ring of black square markers
      roundRect(x, 40, 22, FW - 80, FH - 44, 18); x.fillStyle = MAT; x.fill(); x.strokeStyle = '#8a8476'; x.lineWidth = 5; x.stroke();
      var M = 62, cols = 9, rows = 4, id = 0;
      function marker(mx, my) {
        id++;
        x.fillStyle = '#000'; x.fillRect(mx, my, M, M);
        x.fillStyle = '#fff';
        var c = M / 6, code = (id * 2654435761) >>> 7;
        for (var a = 0; a < 4; a++) for (var b = 0; b < 4; b++) {
          if ((code >> (a * 4 + b)) & 1) x.fillRect(mx + c + b * c, my + c + a * c, c, c);
        }
      }
      var L = 66, T = 44, stepX = (FW - 2 * L - M) / (cols - 1), stepY = (FH - 2 * T - M) / (rows - 1);
      for (var i = 0; i < cols; i++) { marker(L + i * stepX, T); marker(L + i * stepX, FH - T - M); }
      for (var j = 1; j < rows - 1; j++) { marker(L, T + j * stepY); marker(FW - L - M, T + j * stepY); }
      partPath(x, FW / 2 + 40, FH / 2, 150); x.fillStyle = '#2a3344'; x.fill('evenodd');
    },
    function (x) { // the part cut out of the photo
      roundRect(x, 40, 22, FW - 80, FH - 44, 18); x.fillStyle = 'rgba(28,34,48,.07)'; x.fill();
      partPath(x, FW / 2 + 40, FH / 2, 240); x.fillStyle = 'rgba(248,97,17,.34)'; x.fill('evenodd');
      x.strokeStyle = ORANGE; x.lineWidth = 11; x.lineJoin = 'round'; x.stroke();
    },
    function (x) { // dimension lines around the outline
      var s = 190, cx = FW / 2, cy = FH / 2 + 26;
      partPath(x, cx, cy, s); x.strokeStyle = SOFT; x.lineWidth = 10; x.lineJoin = 'round'; x.stroke();
      x.strokeStyle = ORANGE; x.lineWidth = 10; x.lineCap = 'round';
      var a = cx - 1.17 * s, b = cx + 0.46 * s, y0 = 66;
      x.beginPath(); x.moveTo(a, y0); x.lineTo(b, y0); x.moveTo(a, y0 - 28); x.lineTo(a, y0 + 28); x.moveTo(b, y0 - 28); x.lineTo(b, y0 + 28); x.stroke();
      var c = cy - 0.45 * s, d = cy + 0.45 * s, x0 = b + 96;
      x.beginPath(); x.moveTo(x0, c); x.lineTo(x0, d); x.moveTo(x0 - 28, c); x.lineTo(x0 + 28, c); x.moveTo(x0 - 28, d); x.lineTo(x0 + 28, d); x.stroke();
    },
    function (x) { // a program with knobs
      var rows = [[0, 500], [1, 330, 1], [1, 400, 1], [2, 280], [2, 340, 1], [0, 220]];
      rows.forEach(function (r, i) {
        var y = 44 + i * 74, l = 70 + r[0] * 56;
        roundRect(x, l, y, r[1], 34, 17); x.fillStyle = SOFT; x.globalAlpha = 0.72; x.fill(); x.globalAlpha = 1;
        if (r[2]) {
          var kx = l + r[1] + 40;
          roundRect(x, kx, y + 10, 230, 14, 7); x.fillStyle = LINE; x.fill();
          x.beginPath(); x.arc(kx + 60 + (i * 53) % 130, y + 17, 26, 0, Math.PI * 2); x.fillStyle = ORANGE; x.fill();
        }
      });
    },
    function (x) { // sandbox beside the comparison
      x.setLineDash([30, 20]); x.lineWidth = 9; x.strokeStyle = SOFT;
      roundRect(x, 52, 40, 380, FH - 80, 22); x.stroke(); x.setLineDash([]);
      for (var i = 0; i < 4; i++) { roundRect(x, 92, 96 + i * 88, 290 - i * 52, 32, 16); x.fillStyle = SOFT; x.globalAlpha = 0.65; x.fill(); x.globalAlpha = 1; }
      partPath(x, 760, FH / 2 - 12, 200); x.strokeStyle = SOFT; x.lineWidth = 9; x.lineJoin = 'round'; x.stroke();
      partPath(x, 776, FH / 2 + 12, 200); x.strokeStyle = ORANGE; x.lineWidth = 9; x.stroke();
    },
    function (x) { // the photo with pins
      roundRect(x, 70, 34, FW - 140, FH - 68, 20); x.fillStyle = 'rgba(28,34,48,.06)'; x.fill();
      x.strokeStyle = LINE; x.lineWidth = 6; x.stroke();
      var s = 210, cx = FW / 2 + 30, cy = FH / 2 + 34;
      partPath(x, cx, cy, s); x.fillStyle = 'rgba(91,97,112,.72)'; x.fill('evenodd');
      [[0.42, -0.2], [-0.5, -0.45], [0.36, 0.42]].forEach(function (p) {
        var px = cx + p[0] * s, py = cy + p[1] * s;
        x.beginPath(); x.moveTo(px, py + 4); x.lineTo(px - 27, py - 46); x.arc(px, py - 62, 31, Math.PI * 0.85, Math.PI * 0.15); x.closePath();
        x.fillStyle = ORANGE; x.fill();
        x.beginPath(); x.arc(px, py - 62, 11, 0, Math.PI * 2); x.fillStyle = '#fdfcf9'; x.fill();
      });
    },
    function (x) { // shelves of parts
      for (var r = 0; r < 2; r++) for (var c = 0; c < 5; c++) {
        var l = 52 + c * 186, t = 34 + r * 226;
        roundRect(x, l, t, 166, 206, 16); x.fillStyle = 'rgba(28,34,48,.05)'; x.fill(); x.strokeStyle = LINE; x.lineWidth = 6; x.stroke();
        partPath(x, l + 92, t + 103, 50); x.fillStyle = SOFT; x.globalAlpha = 0.82; x.fill('evenodd'); x.globalAlpha = 1;
      }
    }
  ];

  // ------------------------------------------------------------ slabs
  var slabGeo = rrBox(SW, SD, ST, 16);
  var slabRim = rimGeo(SW, SD, 16, 3);
  var vEdge = new THREE.EdgesGeometry(slabGeo, 40);
  var faceGeo = new THREE.PlaneGeometry(SW - 20, SD - 14).rotateX(-Math.PI / 2);
  var slabs = LAYERS.map(function (L, i) {
    var top = new THREE.MeshBasicMaterial({ color: HEX.top, transparent: true });
    var side = new THREE.MeshBasicMaterial({ color: HEX.side, transparent: true });
    var body = new THREE.Mesh(slabGeo, [top, side]); body.renderOrder = 1;
    var c = mkCanvas(FW, FH); FACE[i](c.getContext('2d'));
    var faceM = new THREE.MeshBasicMaterial({ map: mkTex(c), transparent: true, depthWrite: false });
    var face = new THREE.Mesh(faceGeo, faceM); face.position.y = ST / 2 + 0.3; face.renderOrder = 2;
    var rimM = new THREE.MeshBasicMaterial({ color: HEX.edge, transparent: true, depthWrite: false });
    var rim = new THREE.Mesh(slabRim, rimM); rim.position.y = ST / 2 + 0.5; rim.renderOrder = 3;
    var edgeM = new THREE.LineBasicMaterial({ color: HEX.edge, transparent: true, depthWrite: false });
    var edge = new THREE.LineSegments(vEdge, edgeM); edge.renderOrder = 3;
    var halo = softPlane(SW * 1.42, SD * 1.72, HEX.accent); halo.position.y = -ST / 2 - 1.5; halo.renderOrder = 0;
    var drop = softPlane(SW * 1.36, SD * 1.62, HEX.shade); drop.position.y = -ST / 2 - 2; drop.renderOrder = 0;
    var g = new THREE.Group(); g.add(drop); g.add(halo); g.add(body); g.add(face); g.add(rim); g.add(edge);
    scene.add(g);
    var ghostM = new THREE.MeshBasicMaterial({ color: HEX.edge, transparent: true, depthWrite: false });
    var ghost = new THREE.Mesh(slabRim, ghostM); ghost.position.y = layerY(i) + ST / 2; ghost.renderOrder = 3; scene.add(ghost);
    return { g: g, top: top, side: side, faceM: faceM, rimM: rimM, edgeM: edgeM, halo: halo, drop: drop, ghostM: ghostM, body: body };
  });

  // ------------------------------------------------------------ satellites and traces
  var satGeo = rrBox(SAT_S, SAT_S, SAT_H, 10);
  var satRim = rimGeo(SAT_S, SAT_S, 10, 2.4);
  var unit = new THREE.BoxGeometry(1, 1, 1);
  var chips = SATS.map(function (d) {
    var top = new THREE.MeshBasicMaterial({ color: HEX.top, transparent: true });
    var side = new THREE.MeshBasicMaterial({ color: HEX.side, transparent: true });
    var body = new THREE.Mesh(satGeo, [top, side]); body.renderOrder = 1;
    var rimM = new THREE.MeshBasicMaterial({ color: HEX.edge, transparent: true, depthWrite: false });
    var rim = new THREE.Mesh(satRim, rimM); rim.position.y = SAT_H / 2 + 0.4; rim.renderOrder = 3;
    var halo = softPlane(SAT_S * 1.5, SAT_S * 2.1, HEX.accent); halo.position.y = -SAT_H / 2 - 1; halo.renderOrder = 0;
    var drop = softPlane(SAT_S * 1.45, SAT_S * 2, HEX.shade); drop.position.y = -SAT_H / 2 - 1.5; drop.renderOrder = 0;
    var g = new THREE.Group(); g.add(drop); g.add(halo); g.add(body); g.add(rim);
    scene.add(g);

      Lb.n.style.opacity = Lb.tt.style.opacity = dim.toFixed(3);
      Lb.s.style.opacity = (0.84 + 0.16 * w).toFixed(3);
      Lb.el.style.transform = 'translate(' + fx(LX + 12 * (1 - textR)) + 'px,' + fx(ey - 26) + 'px)';
      Lb.n.style.color = w > 0.5 ? '#f86111' : '';
    }

    // ---- counter
    if (ctr) {
      var cA = proj(SW / 2, layerY(4) + ST / 2, SD / 2);
      var cx = Math.max(1332, cA.x + 22), cy = cA.y - 134;
      var arrivals = [T.arrive0, T.arrive1, T.arrive2];
      var n = ERR.length;
      var done = t >= T.arrive2;
      var fade = 1 - smooth((t - C.human + 0.4) / 0.4);
      ctr.style.opacity = (t >= T.arrive0 ? 1 : 0);
      ctr.style.transform = 'translate(' + fx(cx) + 'px,' + fx(cy) + 'px)';
      ctrHead.style.opacity = fade.toFixed(3);
      function arrivalOf(ri) { return arrivals[n === 1 ? 2 : Math.round(ri * 2 / (n - 1))]; }
      // the newest value always lands on the bottom row; older ones step up
      var cur = 0;
      for (var ci = 1; ci < n; ci++) cur += smooth((t - arrivalOf(ci)) / 0.28);
      ctrHead.style.top = fx((n - 1 - cur) * ROW_H) + 'px';
      ctrRows.forEach(function (r, ri) {
        var last = ri === n - 1;
        var op = t >= arrivalOf(ri) ? 1 : 0;
        if (!last && t >= arrivalOf(ri + 1)) op = 0.45;
        if (!last) op *= fade;
        r.style.opacity = op.toFixed(3);
        r.style.top = fx(ROW_TOP + (n - 1 + ri - cur) * ROW_H) + 'px';
        r.style.color = last && done ? '#007439' : '#1c2230';
      });
      var cOn = ease(span(t, T.arrive2 + 0.05, 0.3));
      vChip.style.opacity = cOn.toFixed(3);
      vChip.style.transform = 'translate(' + fx(cx) + 'px,' + fx(cy + ROW_TOP + n * ROW_H + 6 + 6 * (1 - cOn)) + 'px)';
      var lastY = cy + ROW_TOP + (n - 1) * ROW_H + ROW_H / 2;
      ctrLine.setAttribute('d', 'M' + fx(cA.x) + ' ' + fx(cA.y) + ' L' + fx(cx - 10) + ' ' + fx(lastY));
      ctrLine.setAttribute('stroke-dashoffset', (1 - ease(span(t, T.arrive0, 0.3))).toFixed(4));
      ctrLine.setAttribute('opacity', t >= T.arrive0 ? (0.45 + 0.55 * Math.max(1 - span(t, C.human, 0.35), fin)).toFixed(3) : 0);
    }

    // ---- blocked packet: tag, impact, callout
    var bA = bp ? bp.a : 0;
    if (bA > 0.01) {
      var pp = proj(bp.x, bp.y, bp.z);
      badTag.style.opacity = (bA * span(t, C.blocked + 0.08, 0.2)).toFixed(3);
      var tagX = pp.x - 100, tagY = pp.y + 22;
      badTag.style.transform = 'translate(' + fx(tagX) + 'px,' + fx(tagY) + 'px)';
      var hit = t - hitTime();
      hitRing.setAttribute('cx', fx(pp.x)); hitRing.setAttribute('cy', fx(pp.y));
      hitRing.setAttribute('r', fx(12 + 40 * clamp01(hit / 0.5)));
      hitRing.setAttribute('opacity', hit >= 0 && hit < 0.5 ? (1 - hit / 0.5).toFixed(3) : 0);
      var callA = win(t, hitTime(), badEnd(), 0.25, 0.25);
      // the callout sits on the stack under the tag, so it clears the chip column
      var tagH = badTag.offsetHeight, kx = tagX - 34, ky = tagY + tagH + 14;
      call.style.opacity = callA.toFixed(3);
      call.style.transform = 'translate(' + fx(kx) + 'px,' + fx(ky + 6 * (1 - callA)) + 'px)';
      callLine.setAttribute('d', 'M' + fx(tagX + 70) + ' ' + fx(tagY + tagH) + ' L' + fx(tagX + 70) + ' ' + fx(ky));
      callLine.setAttribute('stroke-dashoffset', (1 - ease(span(t, hitTime(), 0.3))).toFixed(4));
      callLine.setAttribute('opacity', callA.toFixed(3));
    } else {
      badTag.style.opacity = 0; call.style.opacity = 0;
      callLine.setAttribute('opacity', 0); hitRing.setAttribute('opacity', 0);
    }

    // ---- export gate, sitting in the slot above
    var gate = proj(0, layerY(6) + ST / 2 + 2, 0);
    gate.y = Math.max(gate.y, 46);
    var openU = smooth((t - C.registry - 0.2) / 0.35);
    var gateOn = ease(span(t, C.blocked + 0.2, 0.35));
    lockLocked.style.opacity = (gateOn * (1 - openU)).toFixed(3);
    lockOpen.style.opacity = (gateOn * openU).toFixed(3);
    lockLocked.style.transform = 'translate(' + fx(gate.x) + 'px,' + fx(gate.y) + 'px) translate(-50%,-50%)';
    lockOpen.style.transform = lockLocked.style.transform;

    // ---- accepted chip
    var acc = ease(span(t, C.human + 0.15, 0.35));
    var hA = proj(SW / 2, layerY(5) + ST / 2, SD / 2);
    var ax = Math.max(1332, hA.x + 22), ay = hA.y - 26;
    accepted.style.opacity = acc.toFixed(3);
    accepted.style.transform = 'translate(' + fx(ax + 10 * (1 - acc)) + 'px,' + fx(ay) + 'px)';
    acceptedLine.setAttribute('d', 'M' + fx(hA.x) + ' ' + fx(hA.y) + ' L' + fx(ax - 6) + ' ' + fx(ay + 23));
    acceptedLine.setAttribute('stroke-dashoffset', (1 - ease(span(t, C.human + 0.05, 0.3))).toFixed(4));
    acceptedLine.setAttribute('opacity', t >= C.human + 0.05 ? (0.45 + 0.55 * Math.max(1 - span(t, C.registry, 0.35), fin)).toFixed(3) : 0);

    renderer.render(scene, camera);
  }

  // ------------------------------------------------------------ label widths, measured once
  function layoutLabels() {
    labels.forEach(function (Lb) { Lb.endX = LX + 46 + Lb.tt.offsetWidth + 14; });
  }

  // ------------------------------------------------------------ page contract
  var playing = false;
  window.__seek = seek;
  window.__start = function () {
    playing = true;
    var t0 = performance.now();
    function tick(now) {
      if (!playing) return;
      var el = Math.max(0, (now - t0) / 1000);
      seek(Math.min(el, DUR));
      if (el < DUR) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  };
  window.__dur = DUR;
  window.__cues = C;

  var fontLoads = ['500 27px "Geist Mono"', '600 32px "Geist Mono"', '600 42px "Geist"', '700 36px "Geist"'].map(function (f) {
    return document.fonts.load(f, 'Phone photo 0123 mm → ·');
  });
  var timeout = new Promise(function (r) { setTimeout(r, 8000); });
  Promise.race([Promise.all(fontLoads).then(function () { return document.fonts.ready; }), timeout]).catch(function () {}).then(function () {
    layoutLabels();
    seek(0);
    window.__ready = true;
  });
})();
</script>
</body>
</html>
