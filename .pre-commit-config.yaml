repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
      - id: private-files
        name: block private files
        entry: bash -c 'git diff --cached --name-only | grep -E "(^|/)(PLAN\.md|KICKOFF_PROMPT\.md|REUSE_LOG\.md|\.env)$" && { echo "private file staged"; exit 1; } || exit 0'
        language: system
        pass_filenames: false
      - id: ruff
        name: ruff
        entry: uv run ruff check
        language: system
        types: [python]
